name: CI Build & Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker environment
        run: docker build -t heat-env .

      - name: Build release application inside Docker
        run: make docker-release

      - name: Build and test inside Docker
        run: make docker-test MODEL=ON
